{% extends "notes/base.html" %}

{% block title %}Register - Notes App{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 mt-5">
            <div class="card-body p-4">
                <h2 class="text-center mb-4">Create an Account</h2>

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        {{ form.as_p }}
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-success btn-lg text-white">Register</button>
                    </div>
                </form>

                <div class="text-center">
                    <p class="mb-0 text-muted">Already have an account?</p>
                    <a href="{% url 'notes:login' %}" class="text-decoration-none text-primary">Login here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
