<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Notes App</title>
</head>
<body>

    <h1>Create an Account</h1>

    {% if messages %}
        <div style="color: blue; margin-bottom: 20px;">
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        {% if form.errors %}
            <div style="color: red;">
                <p>Please correct the errors below:</p>
                {{ form.non_field_errors }}
            </div>
        {% endif %}

        {{ form.as_p }}

        <div>
            <button type="submit">Register</button>
        </div>
    </form>

    <hr>
    <p>
        Already have an account? <a href="{% url 'notes:login' %}">Login here</a>
    </p>

</body>
</html>
