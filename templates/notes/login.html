<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Notes App</title>
</head>
<body>

    <h1>Login</h1>

    {% if messages %}
        <div style="color: red;">
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <div>
            <button type="submit">Sign In</button>
        </div>
    </form>

    <hr>
    <p>
        Don't have an account? <a href="{% url 'notes:register' %}">Register here</a>
    </p>

</body>
</html>
